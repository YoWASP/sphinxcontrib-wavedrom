on: [push, pull_request]
name: Test & publish
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            sphinx-version: "~=7.1.0"
          - python-version: "3.10"
            sphinx-version: "~=8.0"
          - python-version: "3.11"
            sphinx-version: "~=9.0"
            skip-furo: true  # furo doesn't support Sphinx 9 yet
    steps:
      - name: Check out source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        if: ${{ !matrix.skip-furo }}
        run: pdm install --dev
      - name: Install dependencies (without furo)
        if: ${{ matrix.skip-furo }}
        run: pdm install
      - name: Override Sphinx version
        run: pdm run pip install "Sphinx${{ matrix.sphinx-version }}"
      - name: Run tests
        run: pdm test
      - name: Build Python artifact
        if: ${{ matrix.sphinx-version == '~=9.0' }}
        run: pdm build
      - name: Upload Python artifact
        if: ${{ matrix.sphinx-version == '~=9.0' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-pypi
          path: dist/
      - name: Publish test documentation
        if: ${{ matrix.sphinx-version == '~=9.0' }}
        uses: JamesIves/github-pages-deploy-action@releases/v4
        with:
          folder: test/_out/
  check: # group all `test (*)` workflows into one for the required status check
    needs: test
    if: ${{ always() && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: ${{ contains(needs.*.result, 'failure') && 'false' || 'true' }}
  publish:
    needs: check
    if: ${{ github.event_name == 'push' && github.repository == 'YoWASP/sphinxcontrib-wavedrom' }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
    steps:
    - name: Download Python artifacts
      uses: actions/download-artifact@v4
      with:
        name: dist-pypi
        path: dist-tree/
    - name: Prepare artifacts for publishing
      run: |
        mkdir dist
        find dist-tree -name '*.whl' -exec mv {} dist/ \;
    - name: Publish package to Test PyPI
      if: ${{ github.event.ref == 'refs/heads/main' }}
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
    - name: Publish package to PyPI
      if: ${{ startsWith(github.event.ref, 'refs/tags/') }}
      uses: pypa/gh-action-pypi-publish@release/v1
